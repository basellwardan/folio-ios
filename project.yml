name: Folio
options:
  bundleIdPrefix: app.folio
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Folio:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleLocalizations:
          - en
          - ar
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Folio uses the camera to scan your documents. Scans never leave your device.
        NSFaceIDUsageDescription: Folio uses Face ID to keep your documents locked.
        NSPhotoLibraryUsageDescription: Folio can import a photo of a document you choose.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folio.vault
        PRODUCT_NAME: Folio
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO

  FolioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folio.vault.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Folio:
    build:
      targets:
        Folio: all
        FolioTests: [test]
    test:
      targets:
        - FolioTests
    run:
      config: Debug
    archive:
      config: Release
